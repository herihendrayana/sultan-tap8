<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sultan Tap Game</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}h1{color:#ffd700}.card{background:#1a1a1a;padding:15px;margin:15px auto;border-radius:12px;max-width:400px;border:1px solid #333}.btn{padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}.btn-full{width:100%;}#qrcode{margin-top:15px;display:flex;flex-direction:column;align-items:center;gap:10px}#walletStatus{color:#00ff88}</style></head><body><h1>💎 Sultan Tap</h1><button class="btn btn-full" onclick="connectWallet()">Connect Wallet</button><p id="walletStatus">Belum connect</p><div class="card"><h2>💰 Deposit USDT</h2><p>Scan QR atau Copy Alamat di bawah</p><p style="color:#ffaa00;font-size:12px;">WAJIB Jaringan: BSC / BEP20</p><div id="qrcode">Loading QR...</div></div><div class="card"><h2>📲 Scan QR Member</h2><p>Fitur scan QR untuk terima deposit</p><button class="btn" onclick="alert('Fitur Scan QR akan diaktifkan')">Buka Scanner</button></div><script>const DEPOSIT_ADDRESS="0x5215e738a35fa9e7f35b28bcb5e1987390728fd9";const NETWORK="BSC / BEP20";document.getElementById("qrcode").innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${DEPOSIT_ADDRESS}" style="border-radius:10px;background:#fff;padding:10px;" /><p style="word-break:break-all;font-size:12px;background:#222;padding:8px;border-radius:6px;">${DEPOSIT_ADDRESS}</p><p style="color:#00ff88;font-size:14px;">Jaringan: ${NETWORK}</p>`;async function connectWallet(){if(typeof window.ethereum!=='undefined'){try{const accounts=await ethereum.request({method:'eth_requestAccounts'});document.getElementById("walletStatus").innerText="Connected: "+accounts[0].substring(0,6)+"..."+accounts[0].substring(38);}catch(err){alert("Gagal connect wallet");}}else{alert("Install MetaMask / Trust Wallet dulu bos");}}</script></body></html>
