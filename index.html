<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sultan Tap Game</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}h1{color:#ffd700}.card{background:#1a1a1a;padding:20px;margin:20px auto;border-radius:15px;max-width:420px;border:1px solid #333}.btn{padding:14px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:12px;font-size:16px}#qrcode{margin-top:15px;display:flex;flex-direction:column;align-items:center;gap:12px}#scanner{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}#hasilScan{background:#222;padding:10px;border-radius:8px;word-break:break-all;font-size:12px}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><h1>💎 Sultan Tap</h1><div class="card"><h2>💰 Deposit USDT</h2><p>Scan QR atau Copy Alamat di bawah</p><p style="color:#ffaa00;font-size:12px;font-weight:bold;">WAJIB Jaringan: BSC / BEP20</p><div id="qrcode">Loading QR...</div></div><div class="card"><h2>📲 Scan QR Member</h2><p>Scan QR untuk terima deposit dari member</p><div id="scanner" style="display:none;"></div><button class="btn" id="btnScan" onclick="bukaScanner()">Buka Scanner</button><button class="btn" id="btnStop" onclick="tutupScanner()" style="display:none;background:#ff4444;color:#fff;">Tutup Scanner</button><p id="hasilScan" style="display:none;margin-top:15px;"></p></div><script>const DEPOSIT_ADDRESS="0x5215e738a35fa9e7f35b28bcb5e1987390728fd9";document.getElementById("qrcode").innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${DEPOSIT_ADDRESS}" style="border-radius:12px;background:#fff;padding:12px;" /><p style="word-break:break-all;font-size:12px;background:#222;padding:10px;border-radius:8px;">${DEPOSIT_ADDRESS}</p>`;let html5QrcodeScanner;function bukaScanner(){document.getElementById("scanner").style.display="block";document.getElementById("btnScan").style.display="none";document.getElementById("btnStop").style.display="block";html5QrcodeScanner=new Html5Qrcode("scanner");html5QrcodeScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decodedText)=>{document.getElementById("hasilScan").style.display="block";document.getElementById("hasilScan").innerHTML="✅ Hasil Scan:<br>"+decodedText;navigator.clipboard.writeText(decodedText);alert("Alamat berhasil di copy: "+decodedText);tutupScanner();});}function tutupScanner(){if(html5QrcodeScanner){html5QrcodeScanner.stop();}document.getElementById("scanner").style.display="none";document.getElementById("btnScan").style.display="block";document.getElementById("btnStop").style.display="none";}</script></body></html>
