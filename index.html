<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan Tap Game</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px;}
.card{background:#1a1a1a;padding:15px;margin:15px 0;border-radius:10px;border:1px solid #333;}
.btn{padding:12px;background:#00ff88;color:#000;border:none;border-radius:5px;font-weight:bold;cursor:pointer;}
.btn-full{width:100%;}
#qrcode{display:flex;justify-content:center;margin:10px 0;background:#fff;padding:10px;border-radius:10px;}
</style>
</head>
<body>
<h1>💎 Sultan Tap</h1>
<button class="btn btn-full" onclick="connectWallet()">Connect Wallet</button>
<p id="walletStatus">Belum connect</p>
<div class="card">
<h3>QR Code Deposit</h3>
<div id="qrcode">Connect wallet dulu</div>
<p id="walletAddress" style="font-size:12px;word-break:break-all;color:#aaa;"></p>
<button class="btn btn-full" onclick="copyWallet()">Copy Alamat</button>
</div>
<div class="card">
<h3>Scan QR</h3>
<div id="reader" style="width:100%;margin:auto;"></div>
<p>Hasil Scan: <span id="result" style="color:#00FF00"></span></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let userWallet="";
async function connectWallet(){
if(typeof window.ethereum!=='undefined'){
const accounts=await ethereum.request({method:'eth_requestAccounts'});
document.getElementById("walletStatus").innerText="Connected: "+accounts[0];
generateQR(accounts[0]);
}else{alert("Install Metamask dulu!");}}
function generateQR(address){
userWallet=address;
document.getElementById("walletAddress").innerText=address;
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{text:address,width:200,height:200});}
function copyWallet(){
if(userWallet=="")return alert("Connect wallet dulu!");
navigator.clipboard.writeText(userWallet);
alert("Alamat disalin!");}
function onScanSuccess(decodedText){
document.getElementById("result").innerText=decodedText;}
let html5QrcodeScanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:250});
html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
