<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>BANK SULTAN v62.44</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<script src="https://unpkg.com/web3@1.10.0/dist/web3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;padding-bottom:90px;text-align:center}
.hello{color:#6366f1;font-size:32px;font-weight:bold;margin-top:20px;text-shadow:0 0 10px #6366f1}
.tanggal{color:#aaa;font-size:12px;margin-bottom:10px}
.logo{color:gold;font-size:28px;font-weight:bold;text-shadow:0 0 20px gold;margin-top:10px}
.slogan{color:#fff;font-size:14px}
.waktu{color:#aaa;font-size:12px;margin-bottom:20px}
.saldo{font-size:42px;font-weight:bold;margin-top:10px;transition:all 0.3s}
.saldo.claiming{color:gold;transform:scale(1.1);text-shadow:0 0 20px gold}
.label-saldo{color:#aaa;font-size:14px;margin-bottom:5px}
.label-multi{color:cyan;font-size:16px;font-weight:bold;margin-bottom:20px}
.notif{color:#00ff00;font-size:14px;height:25px;margin-top:10px;font-weight:bold}
.notif-error{color:#ff4444;font-size:12px;margin-top:5px}
.btn{border:none;border-radius:20px;padding:16px;width:90%;font-size:16px;font-weight:bold;margin:10px auto;display:block;cursor:pointer}
.btn-biru{background:#1e90ff;color:white}
.btn-hijau{background:#00c853;color:#fff}
.btn-abu{background:#333;color:#fff}
.btn-tap{width:200px;height:200px;border-radius:50%;border:8px solid cyan;margin:20px auto;display:flex;align-items:center;justify-content:center;color:cyan;font-size:32px;font-weight:bold;background:#111;cursor:pointer;box-shadow:0 0 50px cyan}
.btn-tap.active{border-color:gold;color:gold;box-shadow:0 0 60px gold}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 0;z-index:999}
.nav-item{color:#777;font-size:10px;text-align:center;cursor:pointer;flex:1}.nav-item.active{color:gold}
.halaman{display:none}.halaman.active{display:block;padding:15px}
.input{width:90%;padding:12px;background:#222;border:1px solid #444;border-radius:10px;color:#fff;margin:10px auto;display:block}
.box{background:#1a1a1a;margin:15px 0;padding:18px;border-radius:15px}
.label{color:#aaa;font-size:12px;margin-bottom:8px}
.judul-menu{color:gold;font-size:24px;font-weight:bold;margin:20px 0}
</style>
</head>
<body>

<audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>
<audio id="tapSound"><source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg"></audio>
<audio id="claimSound"><source src="https://www.soundjay.com/mechanical/sounds/cash-register-1.mp3" type="audio/mpeg"></audio>

<!-- 1. BERANDA -->
<div id="beranda" class="halaman active">
<div class="hello">Hello World!</div>
<div class="tanggal" id="tanggal"></div>
<div class="logo">💰 BANK SULTAN</div>
<div class="slogan">BHINNEKA TUNGGAL IKA</div>
<div class="waktu" id="waktu"></div>

<div class="saldo" id="saldoGameEl"><span id="saldoGame">0</span> GRD</div>
<div class="label-saldo">Saldo Game</div>
<div class="label-multi">Multiplier: x<span id="multiplier">1</span></div>
<div class="notif" id="notif"></div>
<div class="notif-error" id="notifError"></div>

<button id="btnConnect" class="btn btn-biru">🔗 CONNECT WALLET</button>
<div id="wallet" style="display:none;color:yellow;font-size:12px;margin:8px auto;word-break:break-all;"></div>

<div class="btn-tap" id="tapButton">TAP</div>
</div>

<!-- 2. DANA -->
<div id="dana" class="halaman">
<div class="judul-menu">💰 DANA TERKUNCI</div>
<div class="box">
<div class="label">SALDO DANA</div>
<div class="saldo"><span id="saldoClaim">0</span> GRD</div>
<div class="label">JUMLAH WITHDRAW</div>
<input type="number" id="inputJumlah" class="input" placeholder="Minimal 100 GRD">
<div class="label">ALAMAT WALLET TUJUAN</div>
<input type="text" id="inputAlamat" class="input" placeholder="Otomatis dari wallet" readonly>
<button class="btn btn-hijau" id="btnWithdraw">🏦 WITHDRAW KE WALLET</button>
</div>
</div>

<!-- 3. LP -->
<div id="lp" class="halaman">
<div class="judul-menu">💧 TAMBAH LIKUIDITAS GRD</div>
<div class="box">
<button onclick="window.open('https://swap.cakebaker.finance/add/BNB/0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4')" class="btn btn-biru">1. TAMBAH LP CAKEBAKER</button>
<button onclick="window.open('https://apeswap.finance/add/BNB/0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4')" class="btn btn-kuning">2. TAMBAH LP APESWAP</button>
<button onclick="window.open('https://app.biswap.org/add/BNB/0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4')" class="btn btn-hijau">3. TAMBAH LP BISWAP</button>
</div>
</div>

<!-- 4. REWARD -->
<div id="reward" class="halaman">
<div class="judul-menu">🎁 REWARD HARIAN</div>
<div class="box">
<p style="margin:10px 0">Claim 500 GRD setiap 24 jam</p>
<button id="btnReward" class="btn btn-abu">🎁 CLAIM REWARD</button>
<div id="rewardTimer" style="color:orange;font-size:12px;margin-top:10px"></div>
</div>
</div>

<!-- 5. PROFIL -->
<div id="profil" class="halaman">
<div class="judul-menu">⚙️ PROFIL</div>
<div class="box">
<button class="btn" style="background:#dc2626" onclick="resetGame()">🔄 RESET SEMUA DATA</button>
</div>
</div>

<!-- NAVBAR 5 MENU -->
<div class="navbar">
<div class="nav-item active" data-page="beranda">🏠<br>Beranda</div>
<div class="nav-item" data-page="dana">💰<br>Dana</div>
<div class="nav-item" data-page="lp">💧<br>LP</div>
<div class="nav-item" data-page="reward">🎁<br>Reward</div>
<div class="nav-item" data-page="profil">⚙️<br>Profil</div>
</div>

<script>
let saldoGame=0,saldoClaim=0,auto=false,interval,multiplier=1,lastReward=0,isClaiming=false;
let web3,walletAddress="",contract;const CA="0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4";const CHAIN_ID="0x38";
const ABI=[{"inputs":[{"name":"to","type":"address"},{"name":"amount","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}];
const bgm=document.getElementById('bgm'),tapSound=document.getElementById('tapSound'),claimSound=document.getElementById('claimSound');bgm.volume=0.4;

function updateWaktu(){let d=new Date();document.getElementById('tanggal').innerText=d.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'})+" "+d.toGMTString().split(' ')[4]+" GMT";document.getElementById('waktu').innerText=d.toLocaleTimeString().replace(/:/g,'.')}
function saveData(){localStorage.setItem('bank_sultan_v62_44',JSON.stringify({sg:saldoGame,sc:saldoClaim,m:multiplier,lr:lastReward}));}
function loadData(){let data=JSON.parse(localStorage.getItem('bank_sultan_v62_44'));if(data){saldoGame=data.sg||0;saldoClaim=data.sc||0;multiplier=data.m||1;lastReward=data.lr||0;}}
function update(){document.getElementById('saldoGame').innerText=Math.floor(saldoGame).toLocaleString();document.getElementById('saldoClaim').innerText=Math.floor(saldoClaim).toLocaleString();document.getElementById('multiplier').innerText=multiplier;}
function gantiHalaman(id,el){document.querySelectorAll('.halaman').forEach(h=>h.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
function tap(){auto=!auto;let btn=document.getElementById('tapButton');if(auto){btn.classList.add('active');btn.innerText="STOP";bgm.play().catch(()=>{});interval=setInterval(()=>{if(!isClaiming){saldoGame+=200*multiplier;tapSound.currentTime=0;tapSound.play().catch(()=>{});cekAutoClaim();}saveData();update();},200);}else{btn.classList.remove('active');btn.innerText="TAP";bgm.pause();clearInterval(interval);}}

function cekAutoClaim(){
if(saldoGame>=100 &&!isClaiming){
isClaiming=true;
let claimJumlah=saldoGame;
let saldoEl=document.getElementById('saldoGameEl');
let notifEl=document.getElementById('notif');
saldoEl.classList.add('claiming');
notifEl.innerText=`💰 CLAIM ${claimJumlah.toLocaleString()} GRD...`;
claimSound.play().catch(()=>{});
setTimeout(()=>{
saldoClaim+=claimJumlah;
multiplier+=1;
saldoGame=0;
document.getElementById('inputJumlah').value=saldoClaim;
saldoEl.classList.remove('claiming');
notifEl.innerText=`✅ Berhasil! Multiplier naik ke x${multiplier}`;
isClaiming=false;
setTimeout(()=>{notifEl.innerText=""},2500);
},1000);
}
}

function claimReward(){let now=Date.now();if(now-lastReward<86400000){let sisa=86400000-(now-lastReward);let jam=Math.floor(sisa/3600000);let menit=Math.floor((sisa%3600000)/60000);alert("Tunggu "+jam+"j "+menit+"m lagi");return;}saldoGame+=500;lastReward=now;saveData();update();alert("Berhasil Claim 500 GRD!")}
function updateRewardTimer(){let now=Date.now();if(now-lastReward>=86400000){document.getElementById('rewardTimer').innerText="Reward siap di claim!";document.getElementById('btnReward').className="btn btn-hijau"}else{let sisa=86400000-(now-lastReward);let jam=Math.floor(sisa/3600000);let menit=Math.floor((sisa%3600000)/60000);document.getElementById('rewardTimer').innerText="Tersedia dalam: "+jam+"j "+menit+"m";document.getElementById('btnReward').className="btn btn-abu"}}

// FIX KHUS BINANCE WEB3 + SARAN BINANCE AI
let provider = window.BinanceChain || window.ethereum;

async function cekWalletSudahTerhubung(){
if(!provider) return;
web3 = new Web3(provider);
try{
const acc = await web3.eth.getAccounts();
if(acc.length > 0){
walletAddress = acc[0];
contract = new web3.eth.Contract(ABI, CA);
document.getElementById('wallet').style.display='block';
document.getElementById('wallet').innerText="Wallet: "+walletAddress.slice(0,6)+"..."+walletAddress.slice(-4);
document.getElementById('inputAlamat').value=walletAddress;
document.getElementById('btnConnect').innerText="✅ TERHUBUNG";
}
}catch(e){}
}

async function connectWallet(){
document.getElementById('notifError').innerText="";
if(!provider){ 
document.getElementById('notifError').innerText="⚠️ Buka dari Binance > Discover > Browser";
alert("GAGAL: Buka link ini di dalam aplikasi Binance > Tab Discover > Browser");
return;
}
web3 = new Web3(provider);
try{
await provider.request({ method: 'eth_requestAccounts' });
const acc = await web3.eth.getAccounts();
walletAddress = acc[0];
contract = new web3.eth.Contract(ABI, CA);
await provider.request({method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }]}).catch(()=>{});
document.getElementById('wallet').style.display='block';
document.getElementById('wallet').innerText="Wallet: "+walletAddress.slice(0,6)+"..."+walletAddress.slice(-4);
document.getElementById('inputAlamat').value=walletAddress;
document.getElementById('btnConnect').innerText="✅ TERHUBUNG";
alert("✅ Wallet Binance Terhubung!");
}catch(e){alert("Gagal: "+e.message)}
}

// Auto reload kalau ganti chain - saran Binance AI
if(provider){
provider.on("chainChanged", () => {
window.location.reload();
});
provider.on("accountsChanged", () => {
window.location.reload();
});
}

async function withdrawBeneran(){if(!walletAddress)return alert("Connect wallet dulu!");let jumlah=parseInt(document.getElementById('inputJumlah').value);let alamat=document.getElementById('inputAlamat').value;if(isNaN(jumlah)||jumlah<100)return alert("Minimal 100 GRD");if(jumlah>saldoClaim)return alert("Saldo tidak cukup");try{let amount=BigInt(jumlah)*(10n**18n);await contract.methods.transfer(alamat,amount.toString()).send({from:walletAddress});saldoClaim-=jumlah;document.getElementById('inputJumlah').value=saldoClaim;saveData();alert("SUKSES WITHDRAW "+jumlah+" GRD");update();}catch(e){alert("Gagal: "+e.message);}}
function resetGame(){if(confirm("Reset semua data?")){localStorage.clear();location.reload();}}
document.addEventListener('DOMContentLoaded',function(){loadData();update();updateWaktu();setInterval(updateWaktu,1000);setInterval(updateRewardTimer,60000);updateRewardTimer();cekWalletSudahTerhubung();document.getElementById('tapButton').onclick=tap;document.getElementById('btnConnect').onclick=connectWallet;document.getElementById('btnWithdraw').onclick=withdrawBeneran;document.getElementById('btnReward').onclick=claimReward;document.querySelectorAll('.nav-item').forEach(item=>{item.onclick=function(){gantiHalaman(this.dataset.page,this)}});setInterval(saveData,5000);});
</script>
</body>
</html>
