<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sultan Tap Game</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}h1{color:#ffd700}.card{background:#1a1a1a;padding:20px;margin:20px auto;border-radius:15px;max-width:420px;border:1px solid #333}.btn{padding:14px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px;font-size:16px}.btn-merah{background:#ff4444;color:#fff}#qrcode{margin-top:15px}#scanner{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}#hasilScan{background:#222;padding:10px;border-radius:8px;word-break:break-all;font-size:12px;margin-top:10px}#fileInput{display:none}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><h1>💎 Sultan Tap</h1><div class="card"><h2>💰 Deposit USDT</h2><p>Scan QR atau Copy Alamat di bawah</p><p style="color:#ffaa00;font-size:12px;font-weight:bold;">WAJIB Jaringan: BSC / BEP20</p><div id="qrcode">Loading QR...</div></div><div class="card"><h2>📲 Scan QR Member</h2><p>Scan QR untuk terima deposit dari member</p><div id="scanner" style="display:none;"></div><button class="btn" id="btnKamera" onclick="bukaKamera()">Buka Kamera</button><button class="btn" onclick="document.getElementById('fileInput').click()">Unggah dari Galeri</button><input type="file" id="fileInput" accept="image/*" onchange="scanDariGambar(event)"><button class="btn btn-merah" id="btnStop" onclick="tutupScanner()" style="display:none;">Tutup Scanner</button><p id="hasilScan" style="display:none;"></p></div><script>const DEPOSIT_ADDRESS="0x5215e738a35fa9e7f35b28bcb5e1987390728fd9";document.getElementById("qrcode").innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${DEPOSIT_ADDRESS}" style="border-radius:12px;background:#fff;padding:12px;" /><p style="word-break:break-all;font-size:12px;background:#222;padding:10px;border-radius:8px;">${DEPOSIT_ADDRESS}</p>`;let html5QrcodeScanner;function bukaKamera(){document.getElementById("scanner").style.display="block";document.getElementById("btnKamera").style.display="none";document.getElementById("btnStop").style.display="block";html5QrcodeScanner=new Html5Qrcode("scanner");html5QrcodeScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decodedText)=>{tampilkanHasil(decodedText);tutupScanner();});}function tutupScanner(){if(html5QrcodeScanner){html5QrcodeScanner.stop();}document.getElementById("scanner").style.display="none";document.getElementById("btnKamera").style.display="block";document.getElementById("btnStop").style.display="none";}function scanDariGambar(event){const file=event.target.files[0];if(!file)return;const html5QrCode=new Html5Qrcode("scanner");html5QrCode.scanFile(file,true).then(decodedText=>{tampilkanHasil(decodedText);}).catch(err=>{alert("QR tidak terbaca. Coba gambar yg lebih jelas");});}function tampilkanHasil(teks){document.getElementById("hasilScan").style.display="block";document.getElementById("hasilScan").innerHTML="✅ Hasil Scan:<br>"+teks;navigator.clipboard.writeText(teks);alert("Alamat berhasil di copy: "+teks);}</script></body></html>
